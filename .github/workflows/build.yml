name: build-and-publish

# The GitOps half of the loop. CI never touches the cluster — it publishes an
# image and writes a new tag into the GitOps repo. ArgoCD does the rest.
#
# That separation is the security argument for two repos: a compromised
# application pipeline can push a bad image, but it cannot rewrite cluster
# configuration, because it has no cluster credentials to steal.

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [api, web]

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # REQUIRED BY THE CACHE LINES BELOW, and its absence is not obvious.
      #
      # Without this step, build-push-action uses Docker's DEFAULT builder,
      # which runs the `docker` driver. That driver cannot export a build
      # cache, so `cache-to: type=gha` fails the job with:
      #
      #   ERROR: Cache export is not supported for the docker driver.
      #   Switch to a different driver, or turn on the containerd image
      #   store, and try again.
      #
      # GitHub truncates that to "buildx failed with: Learn more at
      # https://docs.docker.com/go/build-cache-backends/", which points at
      # cache documentation and reads like a caching problem rather than a
      # missing builder. Both matrix legs fail identically, which is the clue
      # that it is configuration and not code.
      #
      # setup-buildx-action creates a `docker-container` driver builder, which
      # supports cache export — and ships a buildx recent enough for the
      # current GitHub Actions cache API.
      # ---------------------------------------------------------------------
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # Docker repository names MUST be lowercase, and `github.repository_owner`
      # returns the owner with its real capitalisation — here `Syed-Amjad`.
      # Interpolating it straight into a tag fails the build outright:
      #
      #   ERROR: failed to build: invalid tag
      #   "ghcr.io/Syed-Amjad/api:<sha>": repository name must be lowercase
      #
      # Note that buildx REFUSES rather than silently lowercasing. That matters,
      # because the manifests in platform-gitops/overlays/ hardcode
      # `ghcr.io/syed-amjad/...` — if this step ever published under a different
      # spelling, the kubelet would ask for a path that was never pushed and the
      # failure would surface much later, as an ImagePullBackOff at wave 3.
      #
      # GitHub Actions expressions have no lowercase function, so it is done in
      # bash: ${VAR,,} lowercases the whole string.
      # ---------------------------------------------------------------------
      - name: Lowercase the registry owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          # Tagged with the commit SHA, never :latest. A mutable tag means you
          # cannot tell which code is running, and Project 2's signature
          # verification pins the digest anyway.
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-gitops:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # A fine-grained PAT with contents:write on the GitOps repo ONLY.
      # GITHUB_TOKEN cannot reach another repository, which is the point.
      - name: Update the image tag in the GitOps repo
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPO: ${{ vars.GITOPS_REPO }} # e.g. Syed-Amjad/platform-gitops
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git" gitops
          cd gitops

          # Only the canary (v2) tag moves automatically. v1 is the stable
          # version and is promoted deliberately, by a human, in git —
          # see docs/RUNBOOK-canary.md.
          sed -i "s|^  tag: .*|  tag: ${GITHUB_SHA}|" overlays/prod/values-api-v2.yaml
          sed -i "s|^  tag: .*|  tag: ${GITHUB_SHA}|" overlays/prod/values-web.yaml

          if git diff --quiet; then
            echo "No tag change — nothing to commit."
            exit 0
          fi

          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "chore: publish ${GITHUB_SHA}"
          git push
